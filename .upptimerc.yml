owner: giglogistics
repo: status

# Endpoints we monitor on behalf of our integrators. The list below is the
# minimum useful set — add new entries here whenever a new public API surface
# goes live. Each entry triggers a GitHub Actions cron run every 5 minutes
# from multiple regions.
sites:
  # ── Agility API (.NET 9) ────────────────────────────────────────────────
  - name: Agility API · Production
    url: https://agility.giglogistics.com/health/live
    expectedStatusCodes: [200]

  - name: Agility API · Production · Readiness
    url: https://agility.giglogistics.com/health/ready
    expectedStatusCodes: [200]

  - name: Agility API · Token Endpoint
    url: https://agility.giglogistics.com/token
    method: POST
    headers:
      - "Content-Type: application/x-www-form-urlencoded"
    body: "grant_type=client_credentials"
    # We don't have a valid client_credentials grant here — just want to confirm
    # the auth endpoint is reachable and returning a sane 400/401, not 5xx.
    expectedStatusCodes: [400, 401]

  - name: Agility API · Swagger
    url: https://agility.giglogistics.com/swagger/v1/swagger.json
    expectedStatusCodes: [200]

  # ── Dev environment (lower-tier; useful for partners testing integrations) ──
  - name: Agility API · Dev
    url: https://dev-agility.giglogistics.com/health/live
    expectedStatusCodes: [200]

  - name: Agility API · Dev · Readiness
    url: https://dev-agility.giglogistics.com/health/ready
    expectedStatusCodes: [200]

# Tighten the default thresholds — for a logistics API a slow response is as
# bad as an outage, so degrade at 1.5s and mark down past 3s.
status-website:
  cname: status.giglogistics.com
  logoUrl: https://giglogistics.com/favicon.ico
  name: GIG Logistics API Status
  introTitle: "**GIG Logistics API Status** — real-time uptime and performance for our integrator-facing services."
  introMessage: |
    This page reports the health of every public API surface integrators rely
    on. Data is refreshed every 5 minutes from multiple regions.

    For detailed metrics (request rate, latency percentiles, error rate by
    endpoint), see our [live Grafana dashboard](https://monitoring.giglogistics.com/public-dashboards/05da3fe1595b46569eaba959c9d6ef90).

    Need to report an issue or subscribe to incident updates?
    [Open an issue](https://github.com/giglogistics/status/issues/new/choose).
  navbar:
    - title: Status
      href: /
    - title: Metrics
      href: https://monitoring.giglogistics.com/public-dashboards/05da3fe1595b46569eaba959c9d6ef90
    - title: Report issue
      href: https://github.com/giglogistics/status/issues/new/choose
    - title: Subscribe
      href: https://github.com/giglogistics/status/subscription

# Notification channels (Slack / email / webhook) are configured via repo
# secrets — see https://upptime.js.org/docs/notifications. We're starting with
# GitHub Issue auto-open on incident; ops can subscribe to issue notifications.
notifications: []

# Run a check every 5 minutes (vs the default hourly) so we catch incidents
# inside the 5-minute SLA that most enterprise integrators expect.
workflowSchedule:
  graphs: "0 0 * * *"           # daily graphs render
  responseTime: "0 23 * * *"    # nightly response-time summary
  staticSite: "0 1 * * *"       # nightly static-site rebuild
  summary: "0 0 * * *"          # daily summary
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "*/5 * * * *"         # uptime checks every 5 minutes

assignees:
